spring:
  datasource:
    url: jdbc:h2:mem:lmm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

app:
  public-base-url: http://test.local
  upload-dir: ${java.io.tmpdir}/lmm-test-uploads
  private-dir: ${java.io.tmpdir}/lmm-test-private
  jwt-secret: test-secret-test-secret-test-secret-123
  store:
    auto-approve: true
  wx:
    mock: true
  pay:
    mock: true
  tencent:
    ocr-mock: true
  notification:
    mock: true
  admin:
    init-username: admin
    init-password: Admin12345
